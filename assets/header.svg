<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" role="img" aria-label="Vinicius Freitas Viti">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1900FF"/>
    <stop offset="0.55" stop-color="#12123A"/>
    <stop offset="1" stop-color="#05050F"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
    <stop offset="0" stop-color="#4B5BFF" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#4B5BFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.0"/>
    <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.0"/>
    <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/>
    <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.0"/>
    <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0.0"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="-520 0" to="520 0" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1900FF"/>
    <stop offset="1" stop-color="#7C6BFF"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="tsoft" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>

<rect width="1000" height="250" fill="url(#bg)"/>
<rect width="1000" height="250" fill="url(#glow)"/>

<!-- aurora depth blob -->
<ellipse cx="500" cy="120" rx="360" ry="120" fill="#4B5BFF" opacity="0.20" filter="url(#soft)">
  <animate attributeName="rx" values="360;420;360" dur="9s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.18;0.28;0.18" dur="9s" repeatCount="indefinite"/>
</ellipse>

